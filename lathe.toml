[settings]
mode = "auto"
max_agent_steps = 10
auto_approve_reads = true
theme = "lathe-dark"
blocked_commands = ["rm -rf /", "rm -rf ~", "git reset --hard", "mkfs", "dd if="]

[roles.planner]
backend = "ollama"
model = "hf.co/bartowski/DeepSeek-R1-Distill-Qwen-7B-GGUF:Q4_K_M"
temperature = 0.6
max_tokens = 8192
context_window = 65536

[roles.coder]
backend = "ollama"
model = "hf.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M"
temperature = 0.2
max_tokens = 4096
context_window = 32768

[roles.router]
backend = "ollama"
model = "hf.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M"
temperature = 0.0
max_tokens = 1024
context_window = 8192
