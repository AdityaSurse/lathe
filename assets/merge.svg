<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Model Card Gradients -->
    <linearGradient id="cardAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cardBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="cardMergedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <marker id="arcArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="620" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Title & Subtitle -->
  <text x="460" y="45" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="1">
    LATHE MERGE: SLERP &amp; TIES WEIGHT INTERPOLATION
  </text>
  <text x="460" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">
    Spherical Linear Interpolation layer-by-layer between same-architecture Hugging Face models
  </text>

  <!-- Model A Box (Left) -->
  <g transform="translate(60, 110)">
    <rect width="220" height="180" rx="10" fill="url(#cardAGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ffffff">Model A (Base Coder)</text>
    <text x="110" y="52" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#bae6fd">Qwen2.5-Coder-7B</text>

    <!-- Weight Layers representation -->
    <g transform="translate(20, 70)" font-family="ui-monospace, monospace" font-size="11">
      <rect x="0" y="0" width="180" height="20" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
      <text x="10" y="14" fill="#e0f2fe">W_attn[0..N] (Vectors)</text>
      <rect x="0" y="26" width="180" height="20" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
      <text x="10" y="40" fill="#e0f2fe">W_mlp[0..N] (Weights)</text>
      <rect x="0" y="52" width="180" height="20" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
      <text x="10" y="66" fill="#e0f2fe">W_norm &amp; Head</text>
    </g>
    <circle cx="220" cy="90" r="5" fill="#38bdf8" />
  </g>

  <!-- Model B Box (Right) -->
  <g transform="translate(640, 110)">
    <rect width="220" height="180" rx="10" fill="url(#cardBGrad)" stroke="#fb923c" stroke-width="1.5" />
    <text x="110" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="800" fill="#ffffff">Model B (Reasoner)</text>
    <text x="110" y="52" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fed7aa">DeepSeek-R1-Distill-7B</text>

    <!-- Weight Layers representation -->
    <g transform="translate(20, 70)" font-family="ui-monospace, monospace" font-size="11">
      <rect x="0" y="0" width="180" height="20" rx="3" fill="#7c2d12" stroke="#fb923c" stroke-width="0.8" />
      <text x="10" y="14" fill="#ffedd5">W_attn[0..N] (Vectors)</text>
      <rect x="0" y="26" width="180" height="20" rx="3" fill="#7c2d12" stroke="#fb923c" stroke-width="0.8" />
      <text x="10" y="40" fill="#ffedd5">W_mlp[0..N] (Weights)</text>
      <rect x="0" y="52" width="180" height="20" rx="3" fill="#7c2d12" stroke="#fb923c" stroke-width="0.8" />
      <text x="10" y="66" fill="#ffedd5">W_norm &amp; Head</text>
    </g>
    <circle cx="0" cy="90" r="5" fill="#fb923c" />
  </g>

  <!-- SLERP Hypersphere Arc Diagram (Center) -->
  <g transform="translate(330, 95)">
    <!-- Sphere grid / arc container -->
    <rect width="260" height="210" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="130" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#e5e7eb">Hypersphere Weight Space</text>

    <!-- Coordinate origin -->
    <circle cx="130" cy="180" r="4" fill="#64748b" />
    <text x="130" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">Origin O</text>

    <!-- Weight Vector A -->
    <line x1="130" y1="180" x2="45" y2="70" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="35" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8">W_A</text>

    <!-- Weight Vector B -->
    <line x1="130" y1="180" x2="215" y2="70" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="220" y="60" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fb923c">W_B</text>

    <!-- Arc Path connecting W_A to W_B -->
    <path d="M 50,70 A 130 130 0 0 1 210,70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Interpolated Point along Arc (t = 0.5) -->
    <path d="M 50,70 A 130 130 0 0 1 130,50" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arcArrow)" />
    <circle cx="130" cy="50" r="5" fill="#10b981" />
    <text x="130" y="38" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#34d399">W_merged(t)</text>

    <!-- Angle theta -->
    <path d="M 108,150 A 40 40 0 0 1 152,150" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <text x="130" y="142" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c4b5fd">θ</text>
  </g>

  <!-- Mathematical Formula Box -->
  <g transform="translate(180, 325)">
    <rect width="560" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#94a3b8">
      SLERP Equation:
      <tspan fill="#34d399" font-weight="700"> W(t) = [sin((1-t)θ)/sin θ] · W_A + [sin(tθ)/sin θ] · W_B</tspan>
    </text>
    <text x="280" y="42" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">
      Preserves spherical geometry &amp; norm manifold unlike linear interpolation (LERP)
    </text>
  </g>

  <!-- Flow Arrows to Merge Pipeline Steps -->
  <line x1="460" y1="380" x2="460" y2="420" stroke="#10b981" stroke-width="2.5" marker-end="url(#arcArrow)" />

  <!-- Merged Output Result -->
  <g transform="translate(140, 425)">
    <rect width="640" height="160" rx="12" fill="url(#cardMergedGrad)" stroke="#34d399" stroke-width="2" />
    <text x="320" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#ffffff">
      Merged Model Artifact: lathe-hybrid-7b
    </text>

    <!-- Conversion & Quantization pipeline flow inside merged container -->
    <g transform="translate(30, 55)" font-family="ui-monospace, monospace" font-size="11">
      <!-- Step 1 -->
      <rect x="0" y="0" width="165" height="75" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="82" y="22" text-anchor="middle" font-weight="700" fill="#a7f3d0">1. Mergekit Output</text>
      <text x="82" y="40" text-anchor="middle" fill="#d1fae5">Merged 16-bit FP16</text>
      <text x="82" y="58" text-anchor="middle" fill="#6ee7b7">Safetensors</text>

      <line x1="172" y1="37" x2="198" y2="37" stroke="#34d399" stroke-width="2" marker-end="url(#arcArrow)" />

      <!-- Step 2 -->
      <rect x="205" y="0" width="165" height="75" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="287" y="22" text-anchor="middle" font-weight="700" fill="#a7f3d0">2. llama.cpp Convert</text>
      <text x="287" y="40" text-anchor="middle" fill="#d1fae5">Quantize: Q4_K_M</text>
      <text x="287" y="58" text-anchor="middle" fill="#6ee7b7">GGUF File</text>

      <line x1="377" y1="37" x2="403" y2="37" stroke="#34d399" stroke-width="2" marker-end="url(#arcArrow)" />

      <!-- Step 3 -->
      <rect x="410" y="0" width="170" height="75" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
      <text x="495" y="22" text-anchor="middle" font-weight="700" fill="#a7f3d0">3. Ollama Serve</text>
      <text x="495" y="40" text-anchor="middle" fill="#d1fae5">Modelfile Register</text>
      <text x="495" y="58" text-anchor="middle" fill="#6ee7b7">Ready for `lathe`</text>
    </g>
  </g>
</svg>
