<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Deep Indigo to Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1446" />
      <stop offset="100%" stop-color="#3B1C8C" />
    </linearGradient>

    <!-- Spiral Gradient: Cyan -> Magenta -> Orange -->
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#FF7A45" />
    </linearGradient>

    <!-- Glow Filter for Cursor and Shaving -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cursorGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square icon background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="1008" height="1008" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8" />

  <!-- Geometric lathe curl / metal shaving spiral tightening inward -->
  <g filter="url(#glow)">
    <path d="M 230,512 A 282,282 0 1,1 794,512 A 244,244 0 1,1 306,512 A 206,206 0 1,1 718,512 A 168,168 0 1,1 382,512 A 130,130 0 1,1 642,512 A 92,92 0 1,1 458,512"
          fill="none"
          stroke="url(#spiralGrad)"
          stroke-width="52"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Glowing Block Cursor ▍ at the center -->
  <g filter="url(#cursorGlow)">
    <rect x="494" y="468" width="36" height="88" rx="6" fill="#22D3EE" />
  </g>
</svg>
