<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="latheGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a13" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Precision Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="180" r="280" fill="url(#latheGlow)" />

  <!-- Rotating Chuck / Gear / Lathe Motif (Left & Center Accents) -->
  <g transform="translate(600, 155)">
    <!-- Outer Lathe Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,8" opacity="0.6" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="14,14" opacity="0.5" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4" />

    <!-- Lathe Spindle Bed Axis Lines -->
    <line x1="-380" y1="0" x2="380" y2="0" stroke="#38bdf8" stroke-width="1" stroke-dasharray="12,12" opacity="0.3" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8,8" opacity="0.2" />

    <!-- Lathe Machine Tool Rest & Cutter Bit Silhouette -->
    <path d="M -90,-25 L -55,-10 L -55,10 L -90,25 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <polygon points="-55,-6 -30,0 -55,6" fill="#f59e0b" filter="url(#glow)" />
    <!-- Machining Sparks -->
    <circle cx="-25" cy="-8" r="1.5" fill="#fef08a" />
    <circle cx="-18" cy="4" r="2" fill="#fbbf24" />
    <circle cx="-12" cy="-14" r="1" fill="#f59e0b" />
    <circle cx="-8" cy="2" r="1.5" fill="#fef08a" />
    <circle cx="-4" cy="-5" r="2" fill="#38bdf8" />
  </g>

  <!-- Brand Typography: "lathe" in Bold Monospace -->
  <text x="600" y="195"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Code', 'Courier New', monospace"
        font-size="96"
        font-weight="900"
        letter-spacing="14"
        fill="#f8fafc"
        filter="url(#glow)">lathe</text>

  <!-- Secondary Glow Overlay on Text -->
  <text x="600" y="195"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, 'Cascadia Code', 'Courier New', monospace"
        font-size="96"
        font-weight="900"
        letter-spacing="14"
        fill="url(#cyanGrad)"
        opacity="0.25">lathe</text>

  <!-- Precision Caliper Brackets -->
  <path d="M 370,120 L 340,120 L 340,210 L 370,210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 830,120 L 860,120 L 860,210 L 830,210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Monospace Subtitle Tagline -->
  <text x="600" y="260"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, 'Segoe UI Mono', monospace"
        font-size="22"
        font-weight="600"
        letter-spacing="4"
        fill="#94a3b8">TURN PROMPTS INTO CODE. LOCALLY.</text>

  <!-- Architecture pill badges under tagline -->
  <g transform="translate(600, 310)">
    <!-- Dual-LLM badge -->
    <rect x="-260" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="-246" cy="15" r="4" fill="#38bdf8" />
    <text x="-234" y="20" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1" font-weight="500">Dual-LLM Engine</text>

    <!-- Ollama + HF badge -->
    <rect x="-80" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="-66" cy="15" r="4" fill="#f59e0b" />
    <text x="-54" y="20" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1" font-weight="500">Ollama · HF API</text>

    <!-- lathe merge badge -->
    <rect x="100" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="114" cy="15" r="4" fill="#10b981" />
    <text x="126" y="20" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1" font-weight="500">mergekit (GGUF)</text>
  </g>
</svg>
