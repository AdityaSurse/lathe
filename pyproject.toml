[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lathe-agent"
version = "1.0.0"
description = "Terminal AI coding agent powered by dual open-source models and automated merging."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aditya Surse and Lathe Contributors", email = "maintainers@lathe.ai" }
]
keywords = [
    "ai",
    "coding-agent",
    "llm",
    "developer-tools",
    "terminal",
    "ollama",
    "huggingface",
    "mergekit",
    "dual-agent",
    "code-generation",
    "ast-indexing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
    "prompt-toolkit>=3.0.0",
    "tree-sitter>=0.26.1",
    "tree-sitter-language-pack>=1.25.2",
    "numpy>=2.4.6",
    "tokenizers>=0.23.3",
]

[project.urls]
Homepage = "https://github.com/adityasurse/lathe"
Documentation = "https://adityasurse.github.io/lathe/"
Repository = "https://github.com/adityasurse/lathe"
Issues = "https://github.com/adityasurse/lathe/issues"
Changelog = "https://github.com/adityasurse/lathe/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "playwright>=1.40.0",
]
merge = [
    "mergekit>=0.0.4",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "playwright>=1.40.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
lathe = "lathe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lathe"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["merges"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # Do not perform function call in argument defaults (standard idiom for Typer CLI)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["lathe"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
