repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.10.0
          - typer>=0.15.0
          - rich>=13.9.0
          - pytest>=8.0.0
          - pytest-asyncio>=0.23.0
          - pytest-cov>=5.0.0
        args: [--strict, --config-file=pyproject.toml]
